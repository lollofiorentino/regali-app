<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trova il Regalo Perfetto</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Alegreya', serif; text-align: center; background: linear-gradient(135deg, #0f172a, #1e3a8a, #3b82f6); background-attachment: fixed; color: #ffffff; padding: 30px 20px; margin: 0; }
        .container { max-width: 650px; margin: 0 auto; }
        h1 { font-size: 36px; font-weight: 700; margin-bottom: 30px; text-shadow: 0 2px 4px rgba(0,0,0,0.8); }
        h2 { font-size: 24px; margin-bottom: 15px; color: #93c5fd; }
        .section-card { background: rgba(0, 0, 0, 0.4); border: 1px solid rgba(59, 130, 246, 0.5); backdrop-filter: blur(8px); padding: 30px; border-radius: 16px; margin-bottom: 30px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        select, input { font-family: 'Alegreya', serif; margin: 12px auto; padding: 14px; font-size: 18px; width: 90%; display: block; text-align: center; border: 2px solid #3b82f6; border-radius: 8px; box-sizing: border-box; }
        button { font-family: 'Alegreya', serif; margin: 12px auto; padding: 14px; font-size: 18px; width: 90%; display: block; text-align: center; border-radius: 8px; background: linear-gradient(135deg, #2563eb, #1d4ed8); color: #ffffff; border: none; cursor: pointer; font-weight: 700; transition: all 0.3s ease; }
        button:hover { background: linear-gradient(135deg, #3b82f6, #2563eb); transform: translateY(-2px); }
        #chat-container { display: none; margin-top: 20px; border-top: 1px solid rgba(147, 197, 253, 0.3); padding-top: 25px; }
        #chat-box { border: 1px solid rgba(59, 130, 246, 0.4); height: 250px; overflow-y: auto; padding: 15px; background: rgba(15, 23, 42, 0.9); border-radius: 8px; margin-bottom: 15px; text-align: center; }
        .message { margin-bottom: 12px; font-size: 18px; line-height: 1.4; }
        .bot-msg { color: #fb923c; font-weight: bold; }
        .user-msg { color: #38bdf8; }
        .alert-msg { font-weight: bold; margin-top: 10px; font-size: 18px; color: #4ade80; }
    </style>
</head>
<body>

    <div class="container">
        <h1>Assistente ai Regali</h1>

        <div class="section-card">
            <h2>Crea Profilo</h2>
            <input type="text" id="new-user-name" placeholder="Il tuo nome">
            <button onclick="createUser()">Registrati al sistema</button>
            <div id="reg-status" class="alert-msg"></div>
        </div>
        
        <div class="section-card">
            <h2>1. La Mia Lista dei Desideri</h2>
            <select id="my-user-select" onchange="updateMyUserContext()">
                <option value="">-- Caricamento utenti in corso... --</option>
            </select>
            
            <input type="text" id="wish-desc" placeholder="Cosa desideri? (es. Zaino blu)">
            <input type="text" id="wish-link" placeholder="Link al sito internet (opzionale)">
            <input type="text" id="wish-img" placeholder="Indirizzo immagine (opzionale)">
            <select id="wish-cat">
                <option value="altro">-- Seleziona Categoria --</option>
                <option value="abbigliamento">Abbigliamento</option>
                <option value="elettronica">Elettronica</option>
                <option value="libri">Libri</option>
                <option value="viaggi">Viaggi</option>
                <option value="altro">Altro</option>
            </select>
            <button onclick="addWish()">Aggiungi alla mia Lista</button>
            <div id="wish-status" class="alert-msg"></div>
        </div>

        <div class="section-card">
            <h2>2. Trova un Regalo</h2>
            <select id="target-user-select" onchange="updateTargetUserContext()">
                <option value="">-- Caricamento utenti in corso... --</option>
            </select>
            <button onclick="startChat()">Avvia Assistente AI</button>

            <div id="chat-container">
                <div id="chat-box">
                    <div class="message bot-msg">Seleziona un amico sopra per iniziare.</div>
                </div>
                <input type="text" id="chat-input" placeholder="Es: Voglio regalargli uno zaino da montagna...">
                <button onclick="sendMessage()">Invia Messaggio</button>
            </div>
        </div>
    </div>

    <script>
        // ==========================================
        // CONFIGURAZIONE SUPABASE (INCOLLA QUI LE TUE CHIAVI)
        // ==========================================
        const supabaseUrl = 'https://fjebwqlcpmkptxiaosir.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZqZWJ3cWxjcG1rcHR4aWFvc2lyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk5NjE3OTcsImV4cCI6MjA5NTUzNzc5N30.sMYd6Em6cyO5pMVSolWDGvaqiTWRwVKqZdLTSiWYBic';
        const client = window.supabase.createClient(supabaseUrl, supabaseKey);
        // ==========================================

        let myUser = "";
        let targetUser = "";
        let targetDesideri = []; // Conterrà i desideri scaricati dal database

        // Carica la lista degli utenti all'apertura della pagina
        async function loadUsers() {
            const { data, error } = await client.from('utenti').select('*').order('nome');
            
            const mySelect = document.getElementById('my-user-select');
            const targetSelect = document.getElementById('target-user-select');
            
            let optionsHtml = '<option value="">-- Seleziona un utente --</option>';
            
            if (data) {
                data.forEach(user => {
                    optionsHtml += `<option value="${user.id}">${user.nome}</option>`;
                });
            }
            
            mySelect.innerHTML = optionsHtml;
            targetSelect.innerHTML = optionsHtml;
        }

        // Crea un nuovo utente nel database
        async function createUser() {
            const nomeInput = document.getElementById('new-user-name');
            const nome = nomeInput.value.trim();
            if (!nome) return alert("Inserisci un nome valido.");

            const { data, error } = await client.from('utenti').insert([{ nome: nome }]);
            
            if (error) {
                console.error(error);
                alert("Errore durante la registrazione.");
            } else {
                document.getElementById('reg-status').innerText = `${nome} registrato con successo!`;
                nomeInput.value = "";
                setTimeout(() => { document.getElementById('reg-status').innerText = ""; }, 3000);
                loadUsers(); // Ricarica i menu a tendina
            }
        }

        function updateMyUserContext() {
            myUser = document.getElementById('my-user-select').value;
        }

        function updateTargetUserContext() {
            targetUser = document.getElementById('target-user-select').value;
            document.getElementById('chat-container').style.display = 'none';
        }

        // Salva il desiderio nel database
        async function addWish() {
            if (!myUser) return alert("Seleziona prima chi sei nel menu 'Chi sei tu?'");

            const desc = document.getElementById('wish-desc').value;
            if (!desc) return alert("La descrizione del regalo è obbligatoria.");

            const payload = {
                utente_id: myUser,
                descrizione: desc,
                link_esterno: document.getElementById('wish-link').value || null,
                immagine_url: document.getElementById('wish-img').value || null,
                categoria: document.getElementById('wish-cat').value
            };

            const { error } = await client.from('desideri').insert([payload]);

            if (error) {
                console.error(error);
                alert("Errore durante il salvataggio del desiderio.");
            } else {
                document.getElementById('wish-desc').value = "";
                document.getElementById('wish-link').value = "";
                document.getElementById('wish-img').value = "";
                document.getElementById('wish-cat').value = "altro";

                const status = document.getElementById('wish-status');
                status.innerText = "Desiderio salvato nel database!";
                setTimeout(() => { status.innerText = ""; }, 3000);
            }
        }

        // Avvia la chat scaricando i dati dell'amico dal database
        async function startChat() {
            const select = document.getElementById('target-user-select');
            targetUser = select.value;
            
            if (!targetUser) return alert("Seleziona un amico a cui fare il regalo.");
            if (myUser === targetUser && myUser !== "") return alert("Non puoi chiedere consigli per un regalo da fare a te stesso!");

            document.getElementById('chat-container').style.display = 'block';
            const nomeTarget = select.options[select.selectedIndex].text;
            document.getElementById('chat-box').innerHTML = `<div class="message bot-msg">Sto caricando la lista di ${nomeTarget} dal database...</div>`;

            // Scarica i desideri specifici di questo utente
            const { data, error } = await client.from('desideri').select('*').eq('utente_id', targetUser);
            
            if (error) {
                document.getElementById('chat-box').innerHTML = `<div class="message bot-msg" style="color: red;">Errore di connessione al database.</div>`;
            } else {
                targetDesideri = data; // Salva in memoria per usarli nella chat
                document.getElementById('chat-box').innerHTML = `<div class="message bot-msg">Ho esaminato la lista di ${nomeTarget} (${data.length} regali inseriti). Chiedimi pure in quale categoria vorresti cercare o scrivi un oggetto specifico!</div>`;
            }
        }

        function sendMessage() {
            const input = document.getElementById('chat-input');
            const message = input.value.toLowerCase().trim();
            if (!message) return;

            const chatBox = document.getElementById('chat-box');
            chatBox.innerHTML += `<div class="message user-msg">Tu: ${input.value}</div>`;
            
            setTimeout(() => {
                let botReply = "Mmm, ho analizzato il database ma non ho trovato nulla di simile nella sua lista.";
                
                if (targetDesideri.length > 0) {
                    const paroleRicerca = message.split(/[\s,.'?!]+/).filter(parola => parola.length > 2);

                    const regaliTrovati = targetDesideri.filter(regalo => {
                        const desc = (regalo.descrizione || "").toLowerCase();
                        const cat = (regalo.categoria || "").toLowerCase();
                        const link = (regalo.link_esterno || "").toLowerCase();
                        const img = (regalo.immagine_url || "").toLowerCase();

                        if (message.includes(cat) || message.includes(desc)) return true;

                        return paroleRicerca.some(parola => 
                            desc.includes(parola) || cat.includes(parola) || link.includes(parola) || img.includes(parola)
                        );
                    });

                    if (regaliTrovati.length > 0) {
                        const listaTesto = regaliTrovati.map(r => `• ${r.descrizione} (Categoria: ${r.categoria})`).join('<br>');
                        botReply = `Ho trovato queste corrispondenze nei suoi desideri:<br>${listaTesto}`;
                    }
                }
                
                chatBox.innerHTML += `<div class="message bot-msg">Assistente: ${botReply}</div>`;
                chatBox.scrollTop = chatBox.scrollHeight;
            }, 700);

            input.value = "";
        }

        // All'avvio dell'app, carica la lista utenti
        window.onload = loadUsers;
    </script>
</body>
</html>
